{% extends "base.html" %}
{% block content %}
<h1>Book a trade</h1>
<p class="subtitle">Say the whole deal in one go — who sold, who bought, what, how much, at what rate. Check the fields before saving.</p>

<div class="card" id="mic-card">
  <div id="engine-note" class="small" style="margin-bottom:12px"></div>
  <div style="display:flex;gap:12px;align-items:center;flex-wrap:wrap">
    <button id="rec" class="primary big-btn">🎤 Hold to speak</button>
    <span id="rec-state" class="small">Ready</span>
  </div>
  <details style="margin-top:14px">
    <summary class="small">Or type what was said</summary>
    <div style="display:flex;gap:8px;margin-top:8px">
      <input id="typed" placeholder="Adon se Virat ko pachas bori walnut aath sau tera mein" style="flex:1">
      <button id="parse-typed">Read it</button>
    </div>
  </details>
</div>

<div class="card" id="review" style="display:none;margin-top:18px">
  <div class="card-head"><h2>Check before saving</h2></div>
  <p id="english" style="display:none;font-size:15px;margin:0 0 10px"></p>
  <p class="small" id="heard"></p>
  <div id="fields"></div>
  <div style="display:flex;gap:10px;margin-top:16px;align-items:center">
    <button class="primary" id="save">Save trade</button>
    <button id="discard">Discard</button>
    <span id="computed" class="small"></span>
  </div>
</div>

<div class="card pad0" style="margin-top:18px">
  <div class="card-head"><h2>Booked today</h2><a class="small" href="/trades">All trades</a></div>
  <div class="table-wrap"><table id="recent">
    <thead><tr><th>Seller</th><th>Buyer</th><th>Product</th><th class="num">Qty</th>
      <th class="num">Rate</th><th class="num">Value</th></tr></thead><tbody></tbody></table></div>
</div>

<script>
const $ = s => document.querySelector(s);
let current = null, recorder = null;

const num = v => v == null ? '' : Number(v).toLocaleString('en-IN');

async function boot() {
  const st = await (await fetch('/api/voice/status')).json();
  const reader = st.nlp_available
    ? `understood by <b>${st.nlp_model}</b>`
    : `understood by the built-in parser <span class="small">(no language model running)</span>`;
  $('#engine-note').innerHTML = st.speech_available
    ? `Heard by <b>${st.model}</b> · ${reader} · all on this machine`
    : `<span class="warn">Speech engine not ready on the server — you can still type what was said.</span>`;
  if (!st.speech_available) $('#rec').disabled = true;
  loadRecent();
}

// --- recording -----------------------------------------------------------
//
// getUserMedia is asynchronous and the button is held for as little as a
// moment, so a release routinely arrives while permission is still being
// granted. Two things follow, and both used to go wrong.
//
// The release has to be remembered: `held` is lowered on mouseup whether or
// not a recorder exists yet, and the start path rechecks it after the await.
// Without that a recorder began life already abandoned and ran forever.
//
// And the buffer has to belong to the recording, not to the page. One buffer
// shared across presses meant a second press cleared the first recording's
// audio before its onstop had read it, and what got posted was an empty blob
// — which the server answered with "The recording is empty."
let held = false, starting = false;

async function startRec() {
  if (starting || (recorder && recorder.state === 'recording')) return;
  starting = true;
  held = true;
  let stream;
  try {
    stream = await navigator.mediaDevices.getUserMedia({audio:true});
  } catch (err) {
    starting = false; held = false;
    $('#rec-state').innerHTML = `<span class="warn">No microphone: ${esc(err.message)}</span>`;
    return;
  }
  starting = false;

  // Released during the await: never start, and hand the microphone back.
  if (!held) {
    stream.getTracks().forEach(t => t.stop());
    $('#rec-state').textContent = 'Ready';
    return;
  }

  const mine = [];                      // this recording's audio, not the page's
  const rec = new MediaRecorder(stream);
  recorder = rec;
  rec.ondataavailable = e => { if (e.data && e.data.size) mine.push(e.data); };
  rec.onstop = async () => {
    stream.getTracks().forEach(t => t.stop());
    if (recorder === rec) recorder = null;
    const blob = new Blob(mine, {type:'audio/webm'});
    if (!blob.size) {
      $('#rec-state').innerHTML = '<span class="warn">Nothing was recorded — hold the button while you speak.</span>';
      return;
    }
    $('#rec-state').textContent = 'Listening back…';
    const fd = new FormData();
    fd.append('audio', blob, 'clip.webm');
    await send(fd);
  };
  rec.start();
  $('#rec-state').textContent = 'Recording — release to stop';
}

function stopRec() {
  held = false;
  if (recorder && recorder.state === 'recording') recorder.stop();
}

['mousedown','touchstart'].forEach(e => $('#rec').addEventListener(e, ev => { ev.preventDefault(); startRec(); }));
['mouseup','touchend','mouseleave'].forEach(e => $('#rec').addEventListener(e, ev => { ev.preventDefault(); stopRec(); }));

$('#parse-typed').onclick = async () => {
  const fd = new FormData();
  fd.append('text', $('#typed').value);
  await send(fd);
};

async function send(fd) {
  try {
    const res = await fetch('/api/voice/parse', {method:'POST', body:fd});
    const data = await res.json();
    if (!res.ok) throw new Error(data.detail || 'Could not read that');
    current = data;
    showReview(data);
    const timing = [data.duration_ms ? `heard in ${(data.duration_ms/1000).toFixed(1)}s` : '',
                    data.nlp_ms ? `understood in ${(data.nlp_ms/1000).toFixed(1)}s` : '']
                   .filter(Boolean).join(' · ');
    $('#rec-state').textContent = timing || 'Ready';
  } catch (err) {
    $('#rec-state').innerHTML = `<span class="warn">${err.message}</span>`;
  }
}

// --- review --------------------------------------------------------------
function showReview(d) {
  const heardWords = g => {
    // A figure the numeral tables could not read is left blank on purpose —
    // the model's guess is shown as a hint, never filled in, because it is
    // measurably bad at numbers.
    if (g && g.value == null && g.model_said != null)
      return `<span class="small warn">not read — the model thought “${g.model_said}”. Type it.</span>`;
    if (!g || !g.text) return '<span class="small warn">not heard</span>';
    if (g.snapped_from)
      return `<span class="small">heard “${g.snapped_from}” — matched to a name you have booked before</span>`;
    if (g.model_said != null)
      return `<span class="small">heard “${g.text}” — the model read it as “${g.model_said}”</span>`;
    return `<span class="small">heard “${g.text}”</span>`;
  };
  const colour = {seller:'#2563eb', buyer:'#7c3aed', goods:'#059669',
                  quantity:'#b45309', uom:'#b45309', rate:'#dc2626',
                  marker:'#9ca3af', filler:'#d1d5db', ignored:'#ef4444'};
  const chips = (d.words||[]).map(w =>
    `<span style="border-bottom:3px solid ${colour[w.role]||'#ccc'};margin-right:7px"
       title="${w.role}">${w.word}</span>`).join('');
  // Said in Marathi or Hindi, read back in English. Composed from the fields
  // below it, so if this sentence reads right then what gets saved is right.
  $('#english').innerHTML = d.english
    ? `<b>Understood as:</b> ${d.english}` : '';
  $('#english').style.display = d.english ? '' : 'none';
  $('#heard').innerHTML =
    `<b>Heard:</b> ${chips}` +
    `<div class="small" style="margin-top:6px">` +
    Object.entries(colour).map(([k,c]) =>
      `<span style="border-bottom:3px solid ${c};margin-right:10px">${k}</span>`).join('') +
    `</div>` +
    (d.clip ? `<div class="small" style="margin-top:6px">recording saved as ${d.clip}</div>` : '');
  const val = g => g && g.value != null ? g.value : '';
  $('#fields').innerHTML = `
    <div class="kv"><label>Seller</label><input id="f-seller" value="${val(d.seller)}" placeholder="code or name"> ${heardWords(d.seller)}</div>
    <div class="kv"><label>Buyer</label><input id="f-buyer" value="${val(d.buyer)}" placeholder="code or name"> ${heardWords(d.buyer)}</div>
    <div class="kv"><label>Goods</label><input id="f-goods" value="${val(d.goods)}"> ${heardWords(d.goods)}</div>
    <div class="kv"><label>Quantity</label>
      <input id="f-quantity" type="number" step="0.001" value="${val(d.quantity)}">
      <input id="f-uom" value="${val(d.uom)}" size="6"> ${heardWords(d.quantity)}</div>
    <div class="kv"><label>Rate</label>
      <input id="f-rate" type="number" step="0.01" value="${val(d.rate)}"> ${heardWords(d.rate)}</div>`;
  $('#review').style.display = '';
  ['f-quantity','f-rate'].forEach(id => $('#'+id).addEventListener('input', recompute));
  recompute();
}

function recompute() {
  const q = parseFloat($('#f-quantity').value), r = parseFloat($('#f-rate').value);
  $('#computed').textContent = (isFinite(q) && isFinite(r))
    ? `= ₹ ${num((q*r).toFixed(2))}` : '';
}

$('#discard').onclick = () => { $('#review').style.display='none'; current=null; };

$('#save').onclick = async () => {
  const body = {
    seller: $('#f-seller').value,
    buyer: $('#f-buyer').value,
    goods: $('#f-goods').value,
    quantity: parseFloat($('#f-quantity').value),
    uom: $('#f-uom').value || null,
    rate: parseFloat($('#f-rate').value),
    heard: current ? current.transcript : null,
    parsed: current,
    source: 'voice',
  };
  const res = await fetch('/api/voice/trades', {
    method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body)});
  const data = await res.json();
  if (!res.ok) { $('#rec-state').innerHTML = `<span class="warn">${data.detail}</span>`; return; }
  $('#review').style.display='none';
  $('#rec-state').textContent = `Booked trade #${data.id} — ₹ ${num(data.value)}`;
  loadRecent();
};

async function loadRecent() {
  const d = await (await fetch('/api/voice/trades?limit=10')).json();
  $('#recent').querySelector('tbody').innerHTML = d.trades.map(t => `
    <tr><td>${t.seller||'—'}</td><td>${t.buyer||'—'}</td><td>${t.goods||'—'}</td>
    <td class="num">${num(t.quantity)} ${t.uom||''}</td><td class="num">${num(t.rate)}</td>
    <td class="num">${num(t.value)}</td></tr>`).join('')
    || '<tr><td colspan="6" class="small">Nothing booked yet.</td></tr>';
}
boot();
</script>
{% endblock %}
