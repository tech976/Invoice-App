{% extends "base.html" %}
{% block content %}
<div class="page-head">
  <div>
    <h1>Dashboard</h1>
    <p class="subtitle mb0">Every bill read, checked and filed.</p>
  </div>
  <div class="actions">
    <select id="fy" style="min-width:170px"><option value="">All financial years</option></select>
    <a class="btn primary" href="/upload">Upload bills</a>
  </div>
</div>

<div class="grid c4" style="margin-top:22px" id="stats"></div>

<div class="split even" style="margin-top:4px">
  <div class="card pad0">
    <div class="card-head"><h2>Top sellers</h2><a class="faint" href="/reports">All reports</a></div>
    <div class="table-wrap"><table id="sellers"><tbody></tbody></table></div>
  </div>
  <div class="card pad0">
    <div class="card-head"><h2>Top buyers</h2><a class="faint" href="/reports">All reports</a></div>
    <div class="table-wrap"><table id="buyers"><tbody></tbody></table></div>
  </div>
</div>

<div class="card pad0">
  <div class="card-head"><h2>Recent uploads</h2><a class="faint" href="/invoices">All invoices</a></div>
  <div class="table-wrap"><table id="recent">
    <thead><tr><th>Invoice</th><th>Date</th><th>Seller</th><th>Buyer</th>
      <th class="num">Amount</th><th>Status</th><th>Checks</th></tr></thead>
    <tbody></tbody></table></div>
</div>
{% endblock %}

{% block scripts %}
<script>
async function loadStats(fy) {
  const s = await api('/api/reports/summary?' + qs({ financial_year: fy }));

  const sel = document.getElementById('fy');
  if (!sel.dataset.filled) {
    s.available_years.forEach(y => sel.add(new Option(y, y)));
    sel.dataset.filled = '1';
    sel.value = fy || '';
  }

  const docTotal = Object.values(s.documents_by_status).reduce((a, b) => a + b, 0);
  document.getElementById('stats').innerHTML = `
    <div class="stat"><div class="label">Invoices</div><div class="value">${s.invoice_count}</div>
      <div class="sub">${s.party_count} parties · ${s.product_count} products</div></div>

    <div class="stat"><div class="label">Total billed</div><div class="value">${rupees(s.grand_total)}</div>
      <div class="sub">taxable ${rupees(s.taxable_value)}</div></div>

    <div class="stat"><div class="label">GST</div><div class="value">${rupees(s.tax_total)}</div>
      <div class="sub">across all bills</div></div>

    <div class="stat ${s.needs_review ? 'alert' : ''}"><div class="label">Awaiting review</div>
      <div class="value">${s.needs_review}</div>
      <div class="sub">${s.needs_review ? '<a href="/review">open the queue</a>' : 'nothing pending'}</div></div>

    <div class="stat"><div class="label">Brokerage accrued</div><div class="value">${rupees(s.brokerage_accrued)}</div>
      <div class="sub">${esc(fy || 'all years')}</div></div>

    <div class="stat"><div class="label">Outstanding</div><div class="value">${rupees(s.outstanding)}</div>
      <div class="sub">received ${rupees(s.amount_paid)}</div></div>

    <div class="stat"><div class="label">Documents</div><div class="value">${docTotal}</div>
      <div class="sub">${Object.entries(s.documents_by_status)
        .map(([k, v]) => `${v} ${k.replace(/_/g, ' ')}`).join(' · ') || 'none yet'}</div></div>

    <div class="stat"><div class="label">Confirmed</div>
      <div class="value">${s.invoices_by_status.confirmed || 0}</div>
      <div class="sub">checked and locked</div></div>`;
}

async function loadRollup(dim, elId, fy) {
  const r = await api(`/api/reports/by-${dim}?` + qs({ financial_year: fy, limit: 6 }));
  document.querySelector(`#${elId} tbody`).innerHTML = r.rows.length
    ? r.rows.map(x => `
      <tr><td>${partyLink(x.party)}<div class="faint">${x.invoice_count} bill(s)</div></td>
      <td class="num">${rupees(x.grand_total)}</td></tr>`).join('')
    : '<tr><td class="empty">No data yet</td></tr>';
}

async function loadRecent() {
  const r = await api('/api/invoices?' + qs({ sort: 'recent', limit: 12 }));
  document.querySelector('#recent tbody').innerHTML = r.invoices.length
    ? r.invoices.map(i => `
      <tr>
        <td><a href="/invoices/${i.id}">${esc(i.invoice_number || '(no number)')}</a></td>
        <td class="nowrap">${dmy(i.invoice_date)}</td>
        <td>${partyLink(i.seller)}</td>
        <td>${partyLink(i.buyer)}</td>
        <td class="num">${rupees(i.grand_total)}</td>
        <td>${statusBadge(i.status)}</td>
        <td>${i.error_count ? `<span class="badge err">${i.error_count} error</span> ` : ''}
            ${i.warning_count ? `<span class="badge warn">${i.warning_count} warning</span>` : ''}
            ${!i.error_count && !i.warning_count ? '<span class="badge ok">clean</span>' : ''}</td>
      </tr>`).join('')
    : '<tr><td colspan="7" class="empty">No bills yet — <a href="/upload">upload your first one</a>.</td></tr>';
}

async function refresh() {
  const fy = document.getElementById('fy').value;
  try {
    await Promise.all([
      loadStats(fy), loadRollup('seller', 'sellers', fy),
      loadRollup('buyer', 'buyers', fy), loadRecent(),
    ]);
  } catch (e) { toast(e.message, 'err'); }
}

document.getElementById('fy').addEventListener('change', refresh);
refresh();
</script>
{% endblock %}
