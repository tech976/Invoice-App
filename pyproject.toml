[project]
name = "invoice-ledger"
version = "1.0.0"
description = "Reads trade bills of any format and keeps them as structured data."
requires-python = ">=3.12"

# What the host installs. This is the deployed half of the application: the
# reader, the rules, the screens. The voice stack is deliberately absent —
# faster-whisper, ctranslate2, scipy, soundfile and noisereduce come to some
# 800 MB together and need a machine that persists, which a serverless host is
# not. Dropping them takes the bundle to about 90 MB.
#
# The reader itself loses nothing. It works off the PDF's own text layer and
# its e-invoice QR, and every package that needs is here.
#
# requirements.txt at the root is the *development* set and installs the voice
# stack too; it is kept out of the bundle by .vercelignore. Vercel reads this
# file, and only this file, so the two lists cannot drift into each other.
dependencies = [
    # --- web ---
    "fastapi==0.115.6",
    "jinja2==3.1.5",
    "python-multipart==0.0.20",

    # --- data ---
    "SQLAlchemy==2.0.36",
    "psycopg[binary]==3.2.3",
    "pydantic==2.10.4",
    "pydantic-settings==2.7.0",

    # --- local extraction ---
    # Decodes the e-invoice QR; ships as a wheel, no system packages.
    "zxing-cpp==2.3.0",
    # Renders and parses without poppler — there is none on this host.
    "pypdfium2>=4.30.0",
    # Reads glyph outlines out of PDFs whose fonts carry no character map.
    "fonttools==4.55.3",
    "pypdf==5.1.0",
    "pdfplumber==0.11.4",
    "Pillow==11.0.0",

    # --- utils ---
    "python-dateutil==2.9.0.post0",
    "rapidfuzz==3.10.1",
    "openpyxl==3.1.5",
]

[tool.vercel]
# Without this Vercel picks an entrypoint by filename and finds app/main.py,
# which is the application as a server runs it — background workers, voice
# routes and all. api/index.py is the same app entered the way a serverless
# host needs, so it is named here rather than left to detection.
entrypoint = "api.index:app"

[tool.uv]
# An application, not a library: there is nothing here to build into a wheel,
# and uv should install the dependencies rather than try.
package = false
