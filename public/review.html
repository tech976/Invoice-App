<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Review Queue · Invoice Ledger</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="/static/app.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧾</text></svg>">
</head>
<body>
<header class="topbar">
  <div class="brand">Invoice<span>Ledger</span></div>
  <nav class="main">
    <a href="/" class="">Dashboard</a>
    <a href="/upload" class="">Upload</a>
    
    <a href="/invoices" class="">Invoices</a>
    <a href="/review" class="active">Review</a>
    <a href="/parties" class="">Parties</a>
    <a href="/reports" class="">Reports</a>
  </nav>
  <div class="meta" id="topmeta"></div>
</header>

<main class="">
  
<div class="page-head">
  <div>
    <h1>Review queue</h1>
    <p class="subtitle mb0">Bills where a check failed or the reader was unsure. Lowest confidence first.</p>
  </div>
  <div class="actions"><a class="btn" href="/invoices">All invoices</a></div>
</div>
<div style="height:22px"></div>

<div id="failed"></div>
<div id="queue"></div>

</main>

<div id="toast"></div>
<script src="/static/app.js"></script>
<script>
  api('/api/health').then(h => {
    document.getElementById('topmeta').innerHTML = h.api_key_configured
      ? esc(h.model)
      : '<span class="badge err">no API key &mdash; set ANTHROPIC_API_KEY in .env</span>';
  }).catch(() => {});
</script>

<script>
async function load() {
  const r = await api('/api/reports/review-queue');

  document.getElementById('failed').innerHTML = r.failed_documents.length ? `
    <div class="card">
      <h3>Could not be read</h3>
      ${r.failed_documents.map(d => `
        <div class="flag error">
          <div class="msg"><strong>${esc(d.filename)}</strong> — ${esc(d.error_message || 'unknown error')}</div>
          <div class="actions">
            <button class="small" onclick="retry(${d.id})">Try again</button>
            <a class="btn small" href="/api/documents/${d.id}/file" target="_blank">Open file</a>
          </div>
        </div>`).join('')}
    </div>` : '';

  document.getElementById('queue').innerHTML = r.invoices.length
    ? r.invoices.map(card).join('')
    : '<div class="card"><div class="empty">Nothing waiting — every bill has passed its checks.</div></div>';
}

function card(i) {
  return `
  <div class="card">
    <div class="page-head" style="margin-bottom:14px">
      <div>
        <h2 style="margin-bottom:2px">
          <a href="/invoices/${i.id}">${esc(i.invoice_number || '(no number)')}</a>
          ${statusBadge(i.status)}
        </h2>
        <div class="faint">${dmy(i.invoice_date)} · ${esc(i.seller?.name || '—')} → ${esc(i.buyer?.name || '—')}
          · ${rupees(i.grand_total)}
          ${i.confidence != null ? ` · ${(i.confidence * 100).toFixed(0)}% confidence` : ''}</div>
      </div>
      <div class="actions"><a class="btn primary" href="/invoices/${i.id}">Review</a></div>
    </div>
    <div style="margin-top:10px">
      ${i.flags.map(f => `
        <div class="flag ${f.severity}">
          <div class="msg">${esc(f.message)}</div>
          <div class="rule">${esc(f.rule)}</div>
        </div>`).join('')}
    </div>
  </div>`;
}

async function retry(id) {
  try { await api(`/api/documents/${id}/reprocess`, { method: 'POST' }); toast('Queued again', 'ok'); setTimeout(load, 1200); }
  catch (e) { toast(e.message, 'err'); }
}

load().catch(e => toast(e.message, 'err'));
</script>

</body>
</html>
