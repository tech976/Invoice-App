<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reports · Invoice Ledger</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="/static/app.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧾</text></svg>">
</head>
<body>
<header class="topbar">
  <div class="brand">Invoice<span>Ledger</span></div>
  <nav class="main">
    <a href="/" class="">Dashboard</a>
    <a href="/upload" class="">Upload</a>
    
    <a href="/invoices" class="">Invoices</a>
    <a href="/review" class="">Review</a>
    <a href="/parties" class="">Parties</a>
    <a href="/reports" class="active">Reports</a>
  </nav>
  <div class="meta" id="topmeta"></div>
</header>

<main class="">
  
<div class="page-head">
  <div>
    <h1>Reports</h1>
    <p class="subtitle mb0">Turnover grouped the four ways the desk needs it, plus commodity volumes.</p>
  </div>
  <div class="actions">
    <button id="csv">Export CSV</button>
    <button class="primary" id="xlsx">Export Excel</button>
  </div>
</div>

<div class="toolbar" style="margin-top:22px">
  <select id="dim">
    <option value="seller">By seller</option>
    <option value="buyer">By buyer</option>
    <option value="transporter">By transporter</option>
    <option value="broker">By broker</option>
    <option value="product">By product</option>
  </select>
  <select id="fy"><option value="">All financial years</option></select>
  <input type="date" id="from" title="From date" style="min-width:145px">
  <input type="date" id="to" title="To date" style="min-width:145px">
</div>

<div class="card pad0">
  <div class="table-wrap"><table class="wide" id="report"></table></div>
</div>

<div class="card" style="margin-top:16px">
  <h3>Fields most often corrected by hand</h3>
  <p class="faint" style="margin-top:-4px">A field high on this list is worth fixing in the reader rather than retyping every time.</p>
  <div class="table-wrap"><table id="corrections"></table></div>
</div>

</main>

<div id="toast"></div>
<script src="/static/app.js"></script>
<script>
  api('/api/health').then(h => {
    document.getElementById('topmeta').innerHTML = h.api_key_configured
      ? esc(h.model)
      : '<span class="badge err">no API key &mdash; set ANTHROPIC_API_KEY in .env</span>';
  }).catch(() => {});
</script>

<script>
function params() {
  return {
    financial_year: document.getElementById('fy').value,
    date_from: document.getElementById('from').value,
    date_to: document.getElementById('to').value,
  };
}

async function fillYears() {
  const s = await api('/api/reports/summary');
  const sel = document.getElementById('fy');
  s.available_years.forEach(y => sel.add(new Option(y, y)));
}

async function load() {
  const dim = document.getElementById('dim').value;
  const r = await api(`/api/reports/by-${dim}?` + qs({ ...params(), limit: 500 }));
  const t = document.getElementById('report');

  if (dim === 'product') {
    t.innerHTML = `
      <thead><tr><th>Product</th><th>Category</th><th>HSN</th><th class="num">Bills</th>
        <th class="num">Quantity</th><th class="num">Value ₹</th><th class="num">Avg rate ₹</th></tr></thead>
      <tbody>${r.rows.map(x => `
        <tr><td>${esc(x.product)}</td><td>${esc(x.category || '—')}</td>
        <td class="mono">${esc(x.hsn || '—')}</td>
        <td class="num">${x.invoice_count}</td><td class="num">${qty(x.quantity)}</td>
        <td class="num">${money(x.value)}</td><td class="num">${money(x.avg_rate)}</td></tr>`).join('')
        || '<tr><td colspan="7" class="empty">No data.</td></tr>'}</tbody>
      <tfoot><tr><td colspan="5">Total</td>
        <td class="num">${money(r.rows.reduce((a, x) => a + x.value, 0))}</td><td></td></tr></tfoot>`;
    return;
  }

  t.innerHTML = `
    <thead><tr><th>${dim[0].toUpperCase() + dim.slice(1)}</th><th>GSTIN</th><th>State</th>
      <th class="num">Bills</th><th class="num">Taxable ₹</th><th class="num">Total ₹</th>
      <th class="num">Outstanding ₹</th><th>Last bill</th></tr></thead>
    <tbody>${r.rows.map(x => `
      <tr><td>${partyLink(x.party)}</td>
        <td class="mono">${esc(x.party?.gstin || '—')}</td>
        <td>${esc(x.party?.state_name || '—')}</td>
        <td class="num">${x.invoice_count}</td>
        <td class="num">${money(x.taxable_value)}</td>
        <td class="num">${money(x.grand_total)}</td>
        <td class="num">${money(x.outstanding)}</td>
        <td class="nowrap">${dmy(x.last_invoice)}</td></tr>`).join('')
      || '<tr><td colspan="8" class="empty">No data.</td></tr>'}</tbody>
    <tfoot><tr><td colspan="4">Total</td>
      <td class="num">${money(r.rows.reduce((a, x) => a + x.taxable_value, 0))}</td>
      <td class="num">${money(r.rows.reduce((a, x) => a + x.grand_total, 0))}</td>
      <td class="num">${money(r.rows.reduce((a, x) => a + x.outstanding, 0))}</td>
      <td></td></tr></tfoot>`;
}

async function loadCorrections() {
  const r = await api('/api/reports/corrections?limit=20');
  document.getElementById('corrections').innerHTML = r.rows.length ? `
    <thead><tr><th>Bill format</th><th>Field</th><th class="num">Times corrected</th></tr></thead>
    <tbody>${r.rows.map(x => `<tr><td class="mono">${esc(x.vendor_format)}</td>
      <td class="mono">${esc(x.field)}</td><td class="num">${x.corrections}</td></tr>`).join('')}</tbody>`
    : '<tbody><tr><td style="padding:16px 0;border:0" class="muted">No manual corrections recorded yet.</td></tr></tbody>';
}

['dim','fy','from','to'].forEach(id =>
  document.getElementById(id).addEventListener('change', () => load().catch(e => toast(e.message, 'err'))));
document.getElementById('csv').onclick = () => location = '/api/exports/invoices.csv?' + qs(params());
document.getElementById('xlsx').onclick = () => location = '/api/exports/invoices.xlsx?' + qs(params());

fillYears().then(load).then(loadCorrections).catch(e => toast(e.message, 'err'));
</script>

</body>
</html>
