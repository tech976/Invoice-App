# One file, one click: the web service and its database together.
#
# Render reads this and creates both, then puts the database's own connection
# string into the app's environment. There is nothing to copy, paste, attach
# or configure afterwards, which is the whole reason this file exists.
services:
  - type: web
    name: invoice-ledger
    runtime: python
    plan: free
    # api/requirements.txt is gone — pyproject.toml is what Vercel installs,
    # and it carries neither uvicorn nor the speech stack because that host
    # can run neither. A server needs both, so it installs the server list.
    # The model is fetched here rather than at run time: speech.py loads it
    # with local_files_only, so it must already be on disk when a request
    # arrives.
    buildCommand: >-
      pip install -r deploy/requirements-server.txt &&
      python scripts/fetch_speech_model.py
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      # No disk worth keeping anything on: a free instance's filesystem is
      # wiped on every deploy. So bills live in the database and are read
      # during the upload request, exactly as on any serverless host.
      - key: SERVERLESS
        value: "1"
      # SERVERLESS says where bills are kept, not whether anyone may speak.
      # This host wipes its disk on deploy but does run a real process that
      # outlives the request, which is all voice entry actually needs.
      - key: ENABLE_VOICE
        value: "1"
      # 'small' is the better recogniser and what runs locally, but its
      # int8 weights are about 250 MB resident and a free instance has 512 MB
      # for the model, the interpreter and the web server together. 'base' is
      # roughly 75 MB and leaves room to answer requests. Raise this to
      # 'small' once the instance has the memory for it — Render's Starter
      # plan is still 512 MB, so that means Standard, not the next tier up.
      # Set at build time too: the model is fetched during the build, and
      # fetching one and loading another would download 250 MB for nothing.
      - key: SPEECH_MODEL
        value: "base"
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: DATABASE_URL
        fromDatabase:
          name: invoice-db
          property: connectionString

databases:
  - name: invoice-db
    plan: free
